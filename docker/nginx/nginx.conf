events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Docker's embedded DNS. Paired with the $s3 variable in proxy_pass below so
  # the localstack address is re-resolved rather than pinned at startup.
  resolver 127.0.0.11 valid=30s;

  server {
    listen 80;

    # Bucket-style path - the shape the S3 provider hands back as an image URL,
    # so a stored URL resolves here with nothing but the host swapped.
    location /ecommerce-uploads/ {
      set $s3 http://localstack:4566;
      proxy_pass $s3;

      # Path-style addressing: send the upstream's own name so LocalStack never
      # reads the client's Host as a virtual-host bucket.
      proxy_set_header Host localstack:4566;

      # Objects are stored with the right Content-Type at upload time, so the
      # upstream headers are passed through untouched.
    }

    # Files written by the local upload provider, served off the shared volume.
    # Anything missing there belongs to the bucket, so fall through to S3.
    location /uploads/ {
      root /var/www;
      try_files $uri @s3;
    }

    location @s3 {
      rewrite ^/uploads/(.*)$ /ecommerce-uploads/$1 last;
    }
  }
}
